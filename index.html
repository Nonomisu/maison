<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2B2A30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Maison</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Maison">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E3DA}
a{color:#3E6FB0}a:hover{color:#2B4F80}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.94)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(8px,-12px)}}
.sleep{animation:breathe 2.4s ease-in-out infinite;transform-origin:50% 100%}
.happy{animation:hop .8s ease-in-out infinite}
.calm{}
@keyframes wsnow{0%{transform:translate(0,-8px)}25%{transform:translate(4px,22px)}50%{transform:translate(-2px,52px)}75%{transform:translate(4px,82px)}100%{transform:translate(0,116px)}}
@keyframes wleaf{0%{transform:translate(0,-8px) rotate(0)}30%{transform:translate(14px,30px) rotate(90deg)}60%{transform:translate(4px,65px) rotate(200deg)}100%{transform:translate(18px,116px) rotate(320deg)}}
@keyframes wpetal{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(-10px,30px) rotate(120deg)}100%{transform:translate(-4px,70px) rotate(260deg)}}
@keyframes wrain{from{transform:translate(0,-14px)}to{transform:translate(-14px,118px)}}
@keyframes wwave{0%,100%{transform:translateX(0);opacity:.9}50%{transform:translateX(7px);opacity:.4}}
.wsnow,.wleaf,.wpetal,.wrain{animation-iteration-count:infinite;animation-timing-function:linear}
.wsnow{animation-name:wsnow}.wleaf{animation-name:wleaf}.wpetal{animation-name:wpetal}.wrain{animation-name:wrain}
.wwave{animation:wwave 2.4s ease-in-out infinite}
@keyframes sleigh{0%{transform:translate(-50px,34px)}55%{transform:translate(110px,6px)}100%{transform:translate(110px,6px)}}
.sleigh{animation:sleigh 13s linear infinite;animation-delay:-2s}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.twinkle{animation:twinkle 1.8s ease-in-out infinite}
@keyframes slidedown{from{transform:translateY(-120%)}to{transform:translateY(0)}}
.slidedown{animation:slidedown .3s ease-out}
@keyframes hopx{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hop{animation:hopx .35s ease-in-out infinite}
@keyframes conf{0%{transform:translate(0,-20px) rotate(0)}100%{transform:translate(18px,880px) rotate(540deg)}}
.wconf0,.wconf1{animation-name:conf;animation-timing-function:linear;animation-iteration-count:1;animation-fill-mode:forwards}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.sway{animation:sway 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes fw{0%{transform:scale(.15);opacity:0}12%{opacity:1}70%{opacity:1}100%{transform:scale(1.3);opacity:0}}
.fw{animation:fw 2.2s ease-out infinite}
@keyframes note{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(8px,-34px);opacity:0}}
.note1{animation:note 2.2s ease-out infinite}.note2{animation:note 2.2s ease-out infinite;animation-delay:-1.1s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
.slidein{animation:slidein .28s ease-out}
@keyframes vfly{0%{transform:translate(-50px,0)}35%{transform:translate(440px,-30px)}100%{transform:translate(440px,-30px)}}
@keyframes vswoop{0%{transform:translate(-50px,0)}8%{transform:translate(60px,-40px)}16%{transform:translate(150px,30px)}24%{transform:translate(250px,-30px)}34%{transform:translate(440px,10px)}100%{transform:translate(440px,10px)}}
@keyframes vgeese{0%{transform:translate(-220px,0)}50%{transform:translate(470px,-40px)}100%{transform:translate(470px,-40px)}}
@keyframes vflutter{0%,100%{transform:translate(0,0)}25%{transform:translate(22px,-16px)}50%{transform:translate(44px,4px)}75%{transform:translate(20px,12px)}}
@keyframes vsnow{0%{transform:translate(0,-10px)}50%{transform:translate(8px,215px)}100%{transform:translate(0,440px)}}
@keyframes vleaf{0%{transform:translate(0,-10px) rotate(0)}30%{transform:translate(20px,130px) rotate(90deg)}60%{transform:translate(5px,270px) rotate(200deg)}100%{transform:translate(24px,440px) rotate(320deg)}}
@keyframes vstar{0%,80%{opacity:0;transform:translate(0,0)}82%{opacity:1;transform:translate(10px,4px)}90%{opacity:0;transform:translate(140px,60px)}100%{opacity:0;transform:translate(140px,60px)}}
@keyframes vrobin{0%,55%{opacity:0;transform:translate(0,0)}58%{opacity:1;transform:translate(0,0)}64%{transform:translate(0,-5px)}66%{transform:translate(12px,0)}74%{transform:translate(12px,0)}76%{transform:translate(12px,-5px)}78%{transform:translate(24px,0)}92%{opacity:1;transform:translate(24px,0)}95%,100%{opacity:0;transform:translate(24px,0)}}
.vfly{animation-name:vfly}.vswoop{animation-name:vswoop}.vgeese{animation-name:vgeese}.vflutter{animation-name:vflutter;animation-timing-function:ease-in-out!important}.vsnow{animation-name:vsnow}.vleaf{animation-name:vleaf}.vstar{animation-name:vstar}.vrobin{animation-name:vrobin}
.vfly,.vswoop,.vgeese,.vflutter,.vsnow,.vleaf,.vstar,.vrobin{animation-iteration-count:infinite;animation-timing-function:linear}
@media (prefers-reduced-motion: reduce){.vfly,.vswoop,.vgeese,.vflutter,.vsnow,.vleaf,.vstar,.vrobin{animation:none;opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}25%{transform:scale(.85,1.1)}50%{transform:scale(1.1,.9)}75%{transform:scale(.9,1.05)}}
.flame{animation:flick .5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes glow{0%,100%{box-shadow:0 0 10px 3px rgba(255,243,176,.55)}50%{box-shadow:0 0 18px 7px rgba(255,243,176,.85)}}
.moon{animation:glow 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.flame,.moon{animation:none}}
@keyframes swingk{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.swing{animation:swingk 1.1s ease-in-out infinite;transform-origin:50% 0}
@keyframes vrain{0%{transform:translate(0,-10px)}100%{transform:translate(-30px,440px)}}
.vrain{animation-name:vrain;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.wobble{animation:wobble .35s ease-in-out infinite;transform-origin:50% 100%}
@media (prefers-reduced-motion: reduce){.swing,.vrain,.wobble{animation:none}}
.zzz{animation:zz 2.4s ease-in-out infinite}
.hot:focus-visible{outline:3px solid #D9A441;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.sleep,.happy,.zzz,.slidein,.pulse,.wsnow,.wleaf,.wpetal,.wrain,.wwave,.sleigh,.twinkle,.note1,.note2,.wconf0,.wconf1,.sway{animation:none}}
</style>
<!-- gabarit:fin -->
<style>
html,body{height:100%;margin:0;background:#2B2A30;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
#scene,#scene *{touch-action:manipulation}
#scene{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
#app{width:390px;height:844px;transform-origin:top center;flex-shrink:0}
#porte{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#EDE2D3;font-family:Inter,system-ui,sans-serif;color:#2B2A30;text-align:center}
#porte h1{margin:0;font-family:'Pixelify Sans',Inter,sans-serif;font-size:34px}
#porte p{margin:0;max-width:300px;font-size:15px;line-height:1.5}
#porte button{min-height:52px;padding:0 22px;background:#4A7034;color:#fff;border:3px solid #2B2A30;font-family:'Pixelify Sans',Inter,sans-serif;font-size:18px;font-weight:700;cursor:pointer}
#porte .err{color:#B23A48;font-weight:600}
</style>
</head>
<body>
<div id="porte" role="dialog" aria-labelledby="porteTitre">
<h1 id="porteTitre">Maison</h1>
<p id="porteMsg">L'appli du foyer de Co et Emie.</p>
<button type="button" id="porteBtn">Se connecter avec Google</button>
</div>
<div id="horsLigne" role="status" style="display:none;position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:50;padding:4px 10px;background:#2B2A30;color:#F7F3EE;font:600 12px Inter,sans-serif;border:2px solid #D9A441;white-space:nowrap;pointer-events:none">Hors connexion · tout part au retour du réseau</div>
<script>(function(){var b=document.getElementById("horsLigne");function m(){b.style.display=navigator.onLine?"none":"block";}addEventListener("online",m);addEventListener("offline",m);m();})();</script>
<div id="bandeauTest" style="display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:50;padding:2px 10px;background:#B23A48;color:#fff;font:700 12px Inter,sans-serif;border:2px solid #2B2A30;border-top:0;pointer-events:none">MODE TEST · rien n'est gardé pour la vraie maison</div>
<div id="scene"><div id="app"></div></div>
<script type="module" src="app/main.js?v=302f6b56"></script>
</body>
</html>
